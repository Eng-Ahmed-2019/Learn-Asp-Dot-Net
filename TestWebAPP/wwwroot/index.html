<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Page</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        nav {
            background: #0f172a;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

            nav h2 {
                margin: 0;
            }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 10px 17px;
            color: white;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.25s ease;
        }

            .back-button:hover {
                background: #2563eb;
                border-color: #60a5fa;
                transform: translateX(-3px);
            }

        .back-arrow {
            font-size: 19px;
        }

        .container {
            max-width: 800px;
            margin: 80px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 25px #00000010;
        }

        h1 {
            color: #2563eb;
            margin-bottom: 15px;
        }

        p {
            color: #64748b;
            line-height: 1.8;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
            transition: background 0.2s;
        }

            button:hover {
                background: #1d4ed8;
            }

        @media (max-width: 480px) {
            nav {
                padding: 16px 18px;
            }

                nav h2 {
                    font-size: 19px;
                }

            .back-button {
                padding: 9px 11px;
                font-size: 12px;
            }

            .container {
                margin: 35px auto;
            }

            .card {
                padding: 28px 18px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <h2>My Website</h2>

        <a href="/" class="back-button">
            <span class="back-arrow">←</span>
            <span>Back to Home</span>
        </a>
    </nav>

    <div class="container">
        <div class="card">
            <h1>Welcome!</h1>

            <p>
                This is my first website using
                HTML and CSS with ASP.NET Core.
            </p>

            <button onclick="alert('Hello Ahmed!')">
                Click Me
            </button>
        </div>
    </div>

</body>
</html>
